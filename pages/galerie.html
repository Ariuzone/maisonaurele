<section class="page-hero on-dark">
  <img class="page-hero__bg" src="assets/img/table-dressee.jpg" alt="Table gastronomique dressée en blanc dans la salle de la Maison Aurèle" width="1400" height="933" fetchpriority="high">
  <div class="container">
    <nav class="breadcrumbs" aria-label="Fil d'Ariane">
      <a href="index.html">Accueil</a>
      <span class="sep" aria-hidden="true">/</span><span aria-current="page">Galerie</span>
    </nav>
    <p class="eyebrow">Photographies</p>
    <h1 class="display-lg reveal">La maison en images</h1>
    <p class="lead reveal reveal-d1" style="margin-top:1rem">La salle, la cuisine, la cave et les assiettes. Cliquez sur une photographie pour l'agrandir.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="gallery-grid">
      <button type="button" class="gallery-item gallery-item--wide reveal" data-full="assets/img/hero-accueil.jpg" data-caption="Assiette de la Maison Aurèle, service du soir">
        {{IMG:hero-accueil|Assiette gastronomique dressée, verres de vin en arrière-plan|eager}}
      </button>
      <button type="button" class="gallery-item reveal" data-full="assets/img/salle.jpg" data-caption="La salle de trente-cinq couverts, bois sombre et lumières tamisées">
        {{IMG:salle|La salle à manger de la Maison Aurèle}}
      </button>
      <button type="button" class="gallery-item reveal reveal-d1" data-full="assets/img/cuisine.jpg" data-caption="La brigade en pleine service, cuisine ouverte">
        {{IMG:cuisine|La brigade en pleine service dans la cuisine ouverte}}
      </button>
      <button type="button" class="gallery-item gallery-item--wide reveal reveal-d2" data-full="assets/img/cuisine-passe.jpg" data-caption="Le passe et les fourneaux, une heure avant le service">
        {{IMG:cuisine-passe|Le passe de la cuisine, une heure avant le service}}
      </button>
      <button type="button" class="gallery-item reveal" data-full="assets/img/plat-signe.jpg" data-caption="Le canard de Challans vieilli, plat signature du chef Tanaka">
        {{IMG:plat-signe|Plat signature du chef Tanaka, viande grillée sur planche}}
      </button>
      <button type="button" class="gallery-item reveal reveal-d1" data-full="assets/img/dessert-chocolat.jpg" data-caption="Le chocolat de Tain, ganache et caramel demi-sel">
        {{IMG:dessert-chocolat|Dessert chocolat et caramel coulant}}
      </button>
      <button type="button" class="gallery-item reveal reveal-d2" data-full="assets/img/vin-degustation.jpg" data-caption="Dégustation en cave, quatre millésimes posés sur le fût">
        {{IMG:vin-degustation|Quatre verres de dégustation posés sur un fût de chêne}}
      </button>
      <button type="button" class="gallery-item gallery-item--wide reveal" data-full="assets/img/vignoble.jpg" data-caption="Les coteaux du Beaujolais au lever du jour, d'où vient une partie de la cave">
        {{IMG:vignoble|Vignoble du Beaujolais au lever du jour}}
      </button>
      <button type="button" class="gallery-item reveal reveal-d1" data-full="assets/img/ambiance-bougie.jpg" data-caption="Une table en fin de soirée, à la lueur des bougies">
        {{IMG:ambiance-bougie|Une hôtesse attablée à la lueur des bougies}}
      </button>
      <button type="button" class="gallery-item reveal reveal-d2" data-full="assets/img/terrasse.jpg" data-caption="La terrasse d'été sous la pergola, ouverte de mai à septembre">
        {{IMG:terrasse|La terrasse sous la pergola, en fin de journée}}
      </button>
      <button type="button" class="gallery-item gallery-item--wide reveal" data-full="assets/img/salle-claire.jpg" data-caption="Le Salon Aurèle dressé pour une grande tablée">
        {{IMG:salle-claire|Le Salon Aurèle dressé pour une grande tablée}}
      </button>
    </div>
  </div>
</section>

<dialog class="lightbox on-dark" id="lightbox" aria-label="Visionneuse d'images">
  <button type="button" class="lightbox-close" aria-label="Fermer la visionneuse">✕</button>
  <figure>
    <img src="" alt="">
    <figcaption></figcaption>
  </figure>
  <button type="button" class="lb-prev" aria-label="Image précédente" style="position:absolute;top:50%;left:1rem;transform:translateY(-50%)">‹</button>
  <button type="button" class="lb-next" aria-label="Image suivante" style="position:absolute;top:50%;right:1rem;transform:translateY(-50%)">›</button>
</dialog>
